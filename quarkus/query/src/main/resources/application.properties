# Configuration file

quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=mary
quarkus.datasource.password=abc
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/querydb

quarkus.hibernate-orm.database.generation=drop-and-create

# Quiet the harmless first-run schema warnings: with drop-and-create on a fresh database Hibernate tries to
# DROP objects before they exist (the database/driver reports this as an error) and recreates them right after.
# (The read model itself has no sequences, so this is mainly for parity with the spring-boot query service.)
quarkus.log.category."org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl".level=ERROR
quarkus.log.category."org.mariadb.jdbc.message.server.ErrorPacket".level=ERROR

# Push-based projections: subscribe to the event store via SubscribableEventStoreAsync instead of the
# synchronous readAllEventsForward poll loop (which hangs with the current EventStoreDB/KurrentDB GRPC client).
org.fuin.cqrs4j.projection.mode=push

# Library projection engine (QuarkusViewManager) configuration — single-tenant, no HA lease.
org.fuin.cqrs4j.multitenancy=false
org.fuin.cqrs4j.projection.ha.enabled=false
org.fuin.cqrs4j.projection.ha.owner=quarkus-qry
org.fuin.cqrs4j.projection.ha.ttl=60000

# The library scheduler drives poll-mode cron; keep it enabled/started so projections run.
quarkus.scheduler.start-mode=forced

quarkus.log.level=INFO

quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.http.impl.auth.NTLMEngineImpl
quarkus.native.native-image-xmx=8192m