# Backend-portability profile: the query service projects from the relational esc-jpa event store instead of
# KurrentDB. Activate with SPRING_PROFILES_ACTIVE=esc-jpa. The datasource (application.properties) is reused;
# under this profile the same database also holds the event-store tables (see EscJpaConfig + QryApplication's
# @EntityScan).

# The relational backend has no live subscription, so the view manager catches up by polling (the default).
org.fuin.cqrs4j.projection.mode=poll

# This profile is the only one that creates the esc-jpa event-store tables. With create-drop on a fresh
# database Hibernate first tries to DROP the event-store sequence/tables before they exist, which MariaDB
# reports as an error ("Unknown SEQUENCE: events_seq"); the create step recreates them immediately. Quiet that
# expected first-run drop noise (only under this profile, so real errors stay visible on the default backend).
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=error
logging.level.org.mariadb.jdbc.message.server.ErrorPacket=error
