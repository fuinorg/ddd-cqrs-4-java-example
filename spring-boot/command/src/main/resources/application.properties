
server.port = 8081
#spring.mvc.converters.preferred-json-mapper=jsonb

# Default backend is KurrentDB (gRPC) - no relational database. spring-boot-starter-data-jpa is on the
# classpath only for the "esc-jpa" backend-portability profile, so exclude the datasource/JPA auto-config
# here; the "esc-jpa" profile re-enables it (see application-esc-jpa.properties).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
