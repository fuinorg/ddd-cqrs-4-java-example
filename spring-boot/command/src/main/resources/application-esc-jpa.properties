# Backend-portability profile: the command service writes events to the SAME relational database the query
# service projects from. Activate with SPRING_PROFILES_ACTIVE=esc-jpa.

# Re-enable the datasource / JPA auto-configuration that the default profile excludes.
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:mariadb://localhost:3306/querydb
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=mary
spring.datasource.password=abc
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# The query service owns the schema (it uses create-drop). Start the query service first, then the command
# service, which must not create or drop the shared tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
